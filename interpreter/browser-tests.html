<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaiaSQL Browser Test Runner</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: rgba(255, 252, 246, 0.88);
      --ink: #1f241d;
      --muted: #5b6558;
      --accent: #0f766e;
      --accent-strong: #0b4f4a;
      --pass: #216e39;
      --fail: #a12929;
      --warn: #8a5c00;
      --border: rgba(31, 36, 29, 0.12);
      --shadow: 0 24px 60px rgba(23, 28, 20, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(174, 124, 43, 0.18), transparent 30%),
        linear-gradient(180deg, #efe8db 0%, #f8f5ef 100%);
    }

    main {
      width: min(980px, calc(100vw - 32px));
      margin: 32px auto;
      padding: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 24px 0 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 180ms ease, opacity 180ms ease, background 180ms ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.55; cursor: progress; transform: none; }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: rgba(15, 118, 110, 0.08);
      color: var(--accent-strong);
    }

    .status {
      margin: 0 0 18px;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--accent-strong);
    }

    .log {
      min-height: 360px;
      padding: 18px;
      border-radius: 22px;
      background: #1e2520;
      color: #edf5eb;
      font-family: "SFMono-Regular", "Menlo", monospace;
      font-size: 0.92rem;
      overflow: auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .log-line { margin-bottom: 10px; white-space: pre-wrap; }
    .log-line.pass { color: #98e0a5; }
    .log-line.fail { color: #ff9e9e; }
    .log-line.warn { color: #ffd27f; }

    .footnote {
      margin-top: 14px;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>MaiaSQL Browser Runner</h1>
    <p>
      This harness validates the checked-in parser, the Promise-based prototype runtime, the IndexedDB persistence layer,
      and the WebSQL compatibility adapter directly in the browser.
    </p>
    <div class="toolbar">
      <button class="primary" data-run>Run Browser Suites</button>
      <button class="secondary" data-reset>Reset IndexedDB</button>
    </div>
    <div class="status" data-status>Idle.</div>
    <div class="log" data-log></div>
    <p class="footnote">
      Serve this folder over HTTP so `fetch()` can load the SQL fixtures and parser bundle.
    </p>
  </main>

  <script src="./sql-parser-browser-loader.js"></script>
  <script src="./maiasql-core.js"></script>
  <script src="./maiasql-websql.js"></script>
  <script src="./browser-test-runner.js"></script>
</body>
</html>
